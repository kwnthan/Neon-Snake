<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Snake</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#05020f;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

body.shake{
    animation:shake .35s;
}

@keyframes shake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-8px,5px)}
    40%{transform:translate(8px,-5px)}
    60%{transform:translate(-6px,-4px)}
    80%{transform:translate(6px,4px)}
}

#game{
    width:96vw;
    max-width:500px;
    text-align:center;
}

.neonTitle{
    margin:0 0 8px;
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;
    color:#fff;
    text-shadow:
        0 0 5px #fff,
        0 0 10px #00f2fe,
        0 0 20px #00f2fe,
        0 0 40px #ff007f,
        0 0 70px #ff007f;
}

#info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:4px;
}

.infoBox{
    font-size:19px;
    font-weight:900;
    line-height:1.1;
    color:#00f2fe;
    text-shadow:0 0 9px #00f2fe;
}

.infoBox span{
    color:#fff;
}

#playerName{
    color:#ff66cc!important;
    text-shadow:0 0 9px #ff007f!important;
}

#best{
    color:#ffff00;
    text-shadow:0 0 9px #ffff00;
}

#extraInfo{
    margin:6px 0;
    font-size:17px;
    font-weight:900;
    color:#00f2fe;
    text-shadow:0 0 8px #00f2fe;
}

#topInline{
    color:#ffff00;
    cursor:pointer;
    text-shadow:0 0 8px #ffff00;
}

canvas{
    width:100%;
    max-width:440px;
    aspect-ratio:1/1;
    display:block;
    margin:auto;
    background:#05021a;
    border:4px solid #ff007f;
    border-radius:14px;
    box-shadow:
        0 0 10px #ff007f,
        0 0 25px #ff007f,
        inset 0 0 20px #00f2fe;
    touch-action:none;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:7px;
    margin:9px 0;
    flex-wrap:wrap;
}

.mainBtn{
    padding:9px 16px;
    border:0;
    border-radius:7px;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    user-select:none;
}

#startBtn{
    background:#00f2fe;
    color:#05021a;
    box-shadow:0 0 13px #00f2fe;
}

#reloadBtn{
    background:#ff007f;
    color:#fff;
    box-shadow:0 0 13px #ff007f;
}

#turboBtn{
    background:#333;
    color:#aaa;
}

#turboBtn.on{
    background:#ff8c00;
    color:#fff;
    box-shadow:
        0 0 12px #ff8c00,
        0 0 25px #ff8c00;
}

.controls{
    margin-top:10px;
    display:grid;
    grid-template-columns:60px 60px 60px;
    grid-template-rows:60px 60px 60px;
    gap:10px;
    justify-content:center;
}

.dir{
    width:60px;
    height:60px;
    border:0;
    border-radius:50%;
    background:#ff007f;
    color:#fff;
    font-size:24px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 4px #b30059,
        0 0 10px rgba(255,0,127,.5);
    cursor:pointer;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.dir:active{
    transform:translateY(2px);
    box-shadow:0 2px #b30059;
}

#up{
    grid-column:2;
    grid-row:1;
}

#left{
    grid-column:1;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:3;
}

#message{
    position:absolute;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    font-size:27px;
    font-weight:900;
    pointer-events:none;
    opacity:0;
    z-index:10;
    white-space:nowrap;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #ff007f;
}

.messageShow{
    animation:bonusMessage 1.1s forwards;
}

@keyframes bonusMessage{
    0%{
        opacity:0;
        transform:translate(-50%,-30%) scale(.6);
    }
    20%,80%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:translate(-50%,-120%) scale(1.2);
    }
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.86);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:50;
}

.hidden{
    display:none!important;
}

.modal{
    width:90%;
    max-width:380px;
    padding:25px;
    text-align:center;
    background:#08051a;
    border:2px solid #00f2fe;
    border-radius:15px;
    box-shadow:
        0 0 15px #00f2fe,
        0 0 35px #ff007f;
}

.modal h2{
    margin:0 0 15px;
    font-size:30px;
    color:#fff;
    text-shadow:
        0 0 8px #00f2fe,
        0 0 18px #ff007f;
}

.modal input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:2px solid #ff007f;
    border-radius:7px;
    background:#05020f;
    color:#fff;
    outline:none;
    text-align:center;
    font-size:18px;
}

.modal button{
    padding:11px 30px;
    border:0;
    border-radius:7px;
    background:#00f2fe;
    color:#05021a;
    font-size:16px;
    font-weight:900;
    box-shadow:0 0 15px #00f2fe;
}

#playersList{
    max-height:330px;
    overflow:auto;
    margin:10px 0;
}

.playerHeader,
.playerRow{
    display:grid;
    grid-template-columns:35px 1fr 75px 60px;
    gap:5px;
    align-items:center;
}

.playerHeader{
    padding:6px 3px;
    color:#ffff00;
    font-size:12px;
    font-weight:900;
}

.playerRow{
    padding:9px 3px;
    border-bottom:1px solid #333;
    font-size:14px;
}

.playerRow strong{
    color:#00f2fe;
    text-shadow:0 0 8px #00f2fe;
}

.closeBtn{
    background:#ff007f!important;
    color:#fff!important;
    box-shadow:0 0 12px #ff007f!important;
}

@media(max-height:700px){

    .neonTitle{
        font-size:34px;
        margin-bottom:4px;
    }

    .infoBox{
        font-size:16px;
    }

    .controls{
        margin-top:5px;
    }

    .dir{
        width:52px;
        height:52px;
    }

    .controls{
        grid-template-columns:52px 52px 52px;
        grid-template-rows:52px 52px 52px;
        gap:7px;
    }

    .buttons{
        margin:5px 0;
    }
}
</style>
</head>

<body>

<div id="game">

<h1 class="neonTitle">NEON SNAKE</h1>

<div id="info">

<div class="infoBox">
NAME<br>
<span id="playerName">---</span>
</div>

<div class="infoBox">
SCORE<br>
<span id="score">0</span>
</div>

<div class="infoBox">
BEST<br>
<span id="best">0</span>
</div>

</div>

<div id="extraInfo">
LEVEL <span id="level">1</span>
&nbsp;|&nbsp;
<span id="topInline">TOP PLAYERS</span>
</div>

<div style="position:relative">

<canvas id="canvas" width="400" height="400"></canvas>

<div id="message"></div>

</div>

<div class="buttons">

<button class="mainBtn" id="startBtn">
START
</button>

<button class="mainBtn" id="reloadBtn">
RELOAD
</button>

<button class="mainBtn" id="turboBtn">
TURBO OFF
</button>

</div>

<div class="controls">

<button class="dir" id="up">▲</button>
<button class="dir" id="left">◀</button>
<button class="dir" id="right">▶</button>
<button class="dir" id="down">▼</button>

</div>

</div>


<!-- NAME -->

<div class="overlay" id="nameOverlay">

<div class="modal">

<h2>NEON SNAKE</h2>

<p>Βάλε το όνομά σου</p>

<input
id="nameInput"
maxlength="15"
placeholder="NAME"
autocomplete="off">

<button id="nameOk">
OK
</button>

</div>

</div>


<!-- TOP PLAYERS -->

<div class="overlay hidden" id="playersOverlay">

<div class="modal">

<h2>TOP PLAYERS</h2>

<div id="playersList"></div>

<button class="closeBtn" id="closePlayers">
CLOSE
</button>

</div>

</div>


<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const grid=20;
const cols=20;
const rows=20;

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const levelEl=document.getElementById("level");
const playerNameEl=document.getElementById("playerName");
const startBtn=document.getElementById("startBtn");
const reloadBtn=document.getElementById("reloadBtn");
const turboBtn=document.getElementById("turboBtn");
const nameOverlay=document.getElementById("nameOverlay");
const nameInput=document.getElementById("nameInput");
const nameOk=document.getElementById("nameOk");
const playersOverlay=document.getElementById("playersOverlay");
const topInline=document.getElementById("topInline");
const closePlayers=document.getElementById("closePlayers");
const playersList=document.getElementById("playersList");
const message=document.getElementById("message");

let playerName="";

let score=0;

let best=Number(
localStorage.getItem("snake_best")||0
);

let level=1;
let applesEaten=0;

let gameStarted=false;
let gameOver=false;
let paused=false;

let turboEnabled=false;
let turboActive=false;

let normalInterval=115;
let turboInterval=42;

let lastTime=0;

let snakeColor="#00f2fe";

const backgroundColors=[
"#05021a",
"#07152b",
"#16052b",
"#041d1a",
"#1d1204",
"#18041d",
"#06182b",
"#190617"
];

let bgIndex=0;

const snake={

x:200,
y:200,

dx:grid,
dy:0,

cells:[
{x:200,y:200},
{x:180,y:200},
{x:160,y:200},
{x:140,y:200}
],

maxCells:4

};

let foods=[];

const foodTypes={

apple:{
color:"#ff007f",
points:10
},

strawberry:{
color:"#ff1744",
points:25
},

cherry:{
color:"#ff0033",
points:35
},

orange:{
color:"#ff8c00",
points:20
},

watermelon:{
color:"#00ff66",
points:30
},

grape:{
color:"#9b30ff",
points:50
},

bomb:{
color:"#111",
points:-30
}

};


/* =========================
   AUDIO
========================= */

let audioCtx=null;

function initAudio(){

try{

if(!audioCtx){

audioCtx=new(
window.AudioContext||
window.webkitAudioContext
)();

}

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

}catch(e){}

}

function beep(f,d,type="sine"){

if(!audioCtx)return;

const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();

osc.type=type;
osc.frequency.value=f;

gain.gain.setValueAtTime(
0.08,
audioCtx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioCtx.currentTime+d
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();
osc.stop(audioCtx.currentTime+d);

}

function eatSound(){

beep(600,.08,"square");

setTimeout(
()=>beep(900,.08,"square"),
70
);

}

function bonusSound(){

beep(500,.08);

setTimeout(
()=>beep(800,.08),
80
);

setTimeout(
()=>beep(1200,.12),
160
);

}

function bombSound(){

beep(120,.25,"sawtooth");

setTimeout(
()=>beep(70,.35,"sawtooth"),
100
);

}

function gameOverSound(){

beep(400,.15,"sawtooth");

setTimeout(
()=>beep(280,.18,"sawtooth"),
150
);

setTimeout(
()=>beep(160,.25,"sawtooth"),
350
);

}


/* =========================
   FOOD
========================= */

function randomPosition(){

return{

x:Math.floor(Math.random()*cols)*grid,

y:Math.floor(Math.random()*rows)*grid

};

}

function occupied(x,y){

return snake.cells.some(
c=>c.x===x&&c.y===y
);

}

function createFood(type){

let p;
let tries=0;

do{

p=randomPosition();
tries++;

}
while(
occupied(p.x,p.y)&&
tries<100
);

foods.push({
type:type,
x:p.x,
y:p.y
});

}

function resetFoods(){

foods=[];

createFood("apple");

}

function specialFood(){

const r=Math.random();

if(r<.18){

createFood("strawberry");

}
else if(r<.33){

createFood("cherry");

}
else if(r<.47){

createFood("orange");

}
else if(r<.60){

createFood("watermelon");

}
else if(r<.72){

createFood("grape");

}
else if(
snake.cells.length>=10 &&
r<.84
){

createFood("bomb");

}

}


/* =========================
   RESET SNAKE
========================= */

function resetSnake(){

snake.x=200;
snake.y=200;

snake.dx=grid;
snake.dy=0;

snake.maxCells=4;

snake.cells=[
{x:200,y:200},
{x:180,y:200},
{x:160,y:200},
{x:140,y:200}
];

}


/* =========================
   RESET GAME
========================= */

function resetGame(){

score=0;
level=1;
applesEaten=0;

gameStarted=true;
gameOver=false;
paused=false;

turboActive=false;

normalInterval=115;
turboInterval=42;

snakeColor="#00f2fe";
bgIndex=0;

resetSnake();
resetFoods();

scoreEl.textContent="0";
levelEl.textContent="1";

startBtn.textContent="PAUSE";

draw();

}


/* =========================
   RELOAD
========================= */

/*
   ΣΗΜΑΝΤΙΚΟ:
   Δεν χρησιμοποιούμε location.reload().
   Κάνει εσωτερικό reset ώστε να δουλεύει
   σωστά και μέσα σε Android WebView.
*/

function reloadGame(){

gameStarted=false;
gameOver=false;
paused=false;

turboActive=false;

score=0;
level=1;
applesEaten=0;

normalInterval=115;
turboInterval=42;

snakeColor="#00f2fe";
bgIndex=0;

resetSnake();
resetFoods();

scoreEl.textContent="0";
levelEl.textContent="1";

startBtn.textContent="START";

message.classList.remove(
"messageShow"
);

playerName="";
playerNameEl.textContent="---";

nameInput.value="";

draw();

nameOverlay.classList.remove(
"hidden"
);

setTimeout(
()=>{
nameInput.focus();
},
200
);

}


/* =========================
   DRAW FOOD
========================= */

function drawFood(food){

const f=foodTypes[food.type];

ctx.save();

ctx.shadowBlur=15;
ctx.shadowColor=f.color;


if(food.type==="apple"){

ctx.fillStyle=f.color;

ctx.beginPath();

ctx.arc(
food.x+10,
food.y+11,
7,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#35ff35";

ctx.fillRect(
food.x+10,
food.y+1,
4,
7
);

}


else if(food.type==="strawberry"){

ctx.fillStyle=f.color;

ctx.beginPath();

ctx.moveTo(food.x+2,food.y+5);
ctx.lineTo(food.x+18,food.y+5);
ctx.lineTo(food.x+10,food.y+19);
ctx.closePath();

ctx.fill();

ctx.fillStyle="#00ff66";

ctx.fillRect(
food.x+6,
food.y,
8,
5
);

}


else if(food.type==="cherry"){

ctx.fillStyle=f.color;

ctx.beginPath();

ctx.arc(
food.x+6,
food.y+12,
6,
0,
Math.PI*2
);

ctx.arc(
food.x+15,
food.y+12,
6,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#00ff66";
ctx.lineWidth=2;

ctx.beginPath();

ctx.moveTo(food.x+8,food.y+7);
ctx.lineTo(food.x+11,food.y);
ctx.lineTo(food.x+16,food.y+7);

ctx.stroke();

}


else if(food.type==="orange"){

ctx.fillStyle=f.color;

ctx.beginPath();

ctx.arc(
food.x+10,
food.y+10,
8,
0,
Math.PI*2
);

ctx.fill();

}


else if(food.type==="watermelon"){

ctx.fillStyle="#00cc55";

ctx.beginPath();

ctx.arc(
food.x+10,
food.y+10,
9,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#ff3355";

ctx.beginPath();

ctx.arc(
food.x+10,
food.y+10,
6,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#111";

for(let i=0;i<3;i++){

ctx.fillRect(
food.x+6+i*4,
food.y+7,
2,
2
);

}

}


else if(food.type==="grape"){

ctx.fillStyle=f.color;

[
[5,5],
[12,5],
[2,11],
[9,11],
[16,11],
[6,17],
[13,17]
].forEach(p=>{

ctx.beginPath();

ctx.arc(
food.x+p[0],
food.y+p[1],
4,
0,
Math.PI*2
);

ctx.fill();

});

}


else if(food.type==="bomb"){

ctx.fillStyle="#111";

ctx.beginPath();

ctx.arc(
food.x+10,
food.y+11,
8,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#ff007f";
ctx.lineWidth=2;

ctx.stroke();

ctx.fillStyle="#ff8c00";

ctx.beginPath();

ctx.arc(
food.x+14,
food.y+2,
3,
0,
Math.PI*2
);

ctx.fill();

}

ctx.restore();

}


/* =========================
   DRAW SNAKE
========================= */

function drawSnake(){

snake.cells.forEach(
(cell,index)=>{

ctx.save();

const color=
index===0
?"#ffff00"
:snakeColor;

ctx.fillStyle=color;

ctx.shadowBlur=15;
ctx.shadowColor=color;

ctx.fillRect(
cell.x+2,
cell.y+2,
grid-4,
grid-4
);


if(index===0){

ctx.shadowBlur=0;

ctx.fillStyle="#000";

let eye1;
let eye2;

if(snake.dx>0){

eye1={
x:cell.x+14,
y:cell.y+5
};

eye2={
x:cell.x+14,
y:cell.y+13
};

}
else if(snake.dx<0){

eye1={
x:cell.x+6,
y:cell.y+5
};

eye2={
x:cell.x+6,
y:cell.y+13
};

}
else if(snake.dy<0){

eye1={
x:cell.x+5,
y:cell.y+6
};

eye2={
x:cell.x+13,
y:cell.y+6
};

}
else{

eye1={
x:cell.x+5,
y:cell.y+14
};

eye2={
x:cell.x+13,
y:cell.y+14
};

}

ctx.beginPath();

ctx.arc(
eye1.x,
eye1.y,
2,
0,
Math.PI*2
);

ctx.arc(
eye2.x,
eye2.y,
2,
0,
Math.PI*2
);

ctx.fill();

}

ctx.restore();

});

}


/* =========================
   DRAW BOARD
========================= */

function draw(){

ctx.fillStyle=
backgroundColors[bgIndex];

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.strokeStyle=
"rgba(0,242,254,.07)";

for(
let x=0;
x<canvas.width;
x+=grid
){

ctx.beginPath();

ctx.moveTo(x,0);
ctx.lineTo(x,canvas.height);

ctx.stroke();

}

for(
let y=0;
y<canvas.height;
y+=grid
){

ctx.beginPath();

ctx.moveTo(0,y);
ctx.lineTo(canvas.width,y);

ctx.stroke();

}

foods.forEach(drawFood);

drawSnake();

}


/* =========================
   SCORE
========================= */

function addScore(points){

score+=points;

if(score<0)
score=0;

scoreEl.textContent=score;

if(score>best){

best=score;

bestEl.textContent=best;

localStorage.setItem(
"snake_best",
best
);

}

}


/* =========================
   LEVEL
========================= */

function updateLevel(){

const newLevel=
Math.floor(score/100)+1;

if(newLevel!==level){

level=newLevel;

bgIndex=
(level-1)%backgroundColors.length;

const colors=[
"#00f2fe",
"#00ff99",
"#ff66ff",
"#00aaff",
"#ff9900",
"#ff00aa",
"#66ff00",
"#00ffff"
];

snakeColor=
colors[
(level-1)%colors.length
];

showMessage(
"LEVEL "+level
);

}

levelEl.textContent=level;

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

message.textContent=text;

message.classList.remove(
"messageShow"
);

void message.offsetWidth;

message.classList.add(
"messageShow"
);

}


/* =========================
   SAVE TOP PLAYERS
========================= */

function savePlayer(){

if(!playerName)
return;

let players=
JSON.parse(
localStorage.getItem(
"snake_players"
)||"[]"
);

players.push({

name:playerName,
score:score,
level:level,
date:Date.now()

});

players.sort(
(a,b)=>b.score-a.score
);

players=
players.slice(0,20);

localStorage.setItem(
"snake_players",
JSON.stringify(players)
);

}


/* =========================
   GAME OVER
========================= */

function drawGameOver(){

draw();

ctx.save();

ctx.fillStyle=
"rgba(2,0,12,.90)";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.textAlign="center";

function endGame(){

if(gameOver)
return;

gameOver=true;
gameStarted=false;
paused=false;
turboActive=false;

gameOverSound();

savePlayer();

startBtn.textContent="RESTART";

drawGameOver();

}

========================= */

function step(){

if(
!gameStarted||
paused||
gameOver
)
return;


snake.x+=snake.dx;
snake.y+=snake.dy;


/* WALL WRAP */

if(snake.x<0)
snake.x=canvas.width-grid;

else if(snake.x>=canvas.width)
snake.x=0;


if(snake.y<0)
snake.y=canvas.height-grid;

else if(snake.y>=canvas.height)
snake.y=0;


snake.cells.unshift({
x:snake.x,
y:snake.y
});

if(
snake.cells.length>
snake.maxCells
){

snake.cells.pop();

}


/* SELF COLLISION */

for(
let i=1;
i<snake.cells.length;
i++
){

if(
snake.x===snake.cells[i].x &&
snake.y===snake.cells[i].y
){

endGame();

return;

}

}


/* FOOD */

for(
let i=foods.length-1;
i>=0;
i--
){

const food=foods[i];

if(
snake.x===food.x &&
snake.y===food.y
){

foods.splice(i,1);


/* =================
   BOMB
================= */

if(food.type==="bomb"){

bombSound();

score=Math.max(
0,
score-30
);

scoreEl.textContent=score;

snake.maxCells=
Math.max(
4,
snake.maxCells-3
);

while(
snake.cells.length>
snake.maxCells
){

}
