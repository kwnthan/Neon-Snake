<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Snake</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#05020f;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

body.shake{
    animation:shake .35s;
}

@keyframes shake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-8px,5px)}
    40%{transform:translate(8px,-5px)}
    60%{transform:translate(-6px,-4px)}
    80%{transform:translate(6px,4px)}
}

#game{
    width:96vw;
    max-width:500px;
    text-align:center;
}

.neonTitle{
    margin:0 0 8px;
    font-size:42px;
    font-weight:900;
    letter-spacing:4px;
    color:#fff;
    text-shadow:
        0 0 5px #fff,
        0 0 10px #00f2fe,
        0 0 20px #00f2fe,
        0 0 40px #ff007f,
        0 0 70px #ff007f;
}

#info{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:4px;
}

.infoBox{
    font-size:18px;
    font-weight:900;
    line-height:1.1;
    color:#00f2fe;
    text-shadow:0 0 9px #00f2fe;
}

.infoBox span{
    color:#fff;
}

#playerName{
    color:#ff66cc!important;
    text-shadow:0 0 9px #ff007f!important;
}

#best{
    color:#ffff00;
    text-shadow:0 0 9px #ffff00;
}

#extraInfo{
    margin:6px 0;
    font-size:17px;
    font-weight:900;
    color:#00f2fe;
    text-shadow:0 0 8px #00f2fe;
}

#topInline{
    color:#ffff00;
    cursor:pointer;
}

canvas{
    width:100%;
    max-width:440px;
    aspect-ratio:1/1;
    display:block;
    margin:auto;
    background:#05021a;
    border:4px solid #ff007f;
    border-radius:14px;
    box-shadow:
        0 0 10px #ff007f,
        0 0 25px #ff007f,
        inset 0 0 20px #00f2fe;
    touch-action:none;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:7px;
    margin:9px 0;
    flex-wrap:wrap;
}

.mainBtn{

#reloadBtn{

#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#right{grid-column:3;grid-row:2}

.closeBtn{

.userInfo{

    color:#aaa;
}

.userInfo strong{

}

#playersList{

}

.playerHeader,

/* =====================================================
   GAME SETTINGS
===================================================== */

const grid=20;
const cols=20;
const rows=20;

let score=0;

let best=Number(
    localStorage.getItem("snake_best")||0
);

let level=1;
let applesEaten=0;

let gameStarted=false;
let gameOver=false;
let paused=false;

let turboEnabled=false;
let turboActive=false;

let normalInterval=115;
let turboInterval=42;

let lastTime=0;

let snakeColor="#00f2fe";
let bgIndex=0;

const backgroundColors=[
"#05021a",
"#07152b",
"#16052b",
"#041d1a",
"#1d1204",
"#18041d",
"#06182b",
"#190617"
];

const snake={
x:200,
y:200,
dx:grid,
dy:0,
cells:[],
maxCells:4
};

let foods=[];


/* =====================================================
   FOOD
===================================================== */

const foodTypes={

apple:{color:"#ff007f",points:10},
strawberry:{color:"#ff1744",points:25},
cherry:{color:"#ff0033",points:35},
orange:{color:"#ff8c00",points:20},
watermelon:{color:"#00ff66",points:30},
grape:{color:"#9b30ff",points:50},
bomb:{color:"#111",points:-30}

};


/* =====================================================
   AUDIO
===================================================== */

let audioCtx=null;

function initAudio(){

    if(!audioCtx){

        audioCtx=
            new(window.AudioContext||
            window.webkitAudioContext)();
    }

    if(audioCtx.state==="suspended"){

        audioCtx.resume();
    }
}

function beep(f,d,type="sine"){

    if(!audioCtx)return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=f;

    gain.gain.setValueAtTime(
        .08,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+d
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(
        audioCtx.currentTime+d
    );
}

function eatSound(){

    beep(600,.08,"square");

    setTimeout(()=>{
        beep(900,.08,"square");
    },70);
}

function bonusSound(){

    beep(500,.08);

    setTimeout(()=>{
        beep(800,.08);
    },80);

    setTimeout(()=>{
        beep(1200,.12);
    },160);
}

function bombSound(){

    beep(120,.25,"sawtooth");

    setTimeout(()=>{
        beep(70,.35,"sawtooth");
    },100);
}

function gameOverSound(){

    beep(400,.15,"sawtooth");

    setTimeout(()=>{
        beep(280,.18,"sawtooth");
    },150);

    setTimeout(()=>{
        beep(160,.25,"sawtooth");
    },350);
}


/* =====================================================
   POSITION
===================================================== */

function randomPosition(){

    return{
        x:Math.floor(Math.random()*cols)*grid,
        y:Math.floor(Math.random()*rows)*grid
    };
}

function occupied(x,y){

    return snake.cells.some(
        c=>c.x===x&&c.y===y
    );
}

function createFood(type){

    let p;
    let tries=0;

    do{

        p=randomPosition();
        tries++;

    }while(
        occupied(p.x,p.y)&&
        tries<100
    );

    foods.push({
        type:type,
        x:p.x,
        y:p.y
    });
}

function resetFoods(){

    foods=[];

    createFood("apple");
}

function specialFood(){

    const r=Math.random();

    if(r<.18)
        createFood("strawberry");

    else if(r<.33)
        createFood("cherry");

    else if(r<.47)
        createFood("orange");

    else if(r<.60)
        createFood("watermelon");

    else if(r<.72)
        createFood("grape");

    else if(
        snake.cells.length>=10 &&
        r<.84
    )
        createFood("bomb");
}


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

    score=0;
    level=1;
    applesEaten=0;

    gameOver=false;
    paused=false;
    gameStarted=true;

    turboActive=false;

    normalInterval=115;
    turboInterval=42;

    snakeColor="#00f2fe";
    bgIndex=0;

    snake.x=200;
    snake.y=200;

    snake.dx=grid;
    snake.dy=0;

    snake.maxCells=4;

    snake.cells=[
        {x:200,y:200},
        {x:180,y:200},
        {x:160,y:200},
        {x:140,y:200}
    ];

    scoreEl.textContent="0";
    levelEl.textContent="1";

    resetFoods();

    startBtn.textContent="PAUSE";

    lastTime=performance.now();

    draw();
}


/* =====================================================
   DRAW FOOD
===================================================== */

function drawFood(food){

    const f=foodTypes[food.type];

    ctx.save();

    ctx.shadowBlur=15;
    ctx.shadowColor=f.color;

    if(food.type==="apple"){

        ctx.fillStyle=f.color;

        ctx.beginPath();

        ctx.arc(
            food.x+10,
            food.y+11,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#35ff35";

        ctx.fillRect(
            food.x+10,
            food.y+1,
            4,
            7
        );

    }

    else if(food.type==="strawberry"){

        ctx.fillStyle=f.color;

        ctx.beginPath();

        ctx.moveTo(
            food.x+2,
            food.y+5
        );

        ctx.lineTo(
            food.x+18,
            food.y+5
        );

        ctx.lineTo(
            food.x+10,
            food.y+19
        );

        ctx.closePath();

        ctx.fill();

        ctx.fillStyle="#00ff66";

        ctx.fillRect(
            food.x+6,
            food.y,
            8,
            5
        );
    }

    else if(food.type==="cherry"){

        ctx.fillStyle=f.color;

        ctx.beginPath();

        ctx.arc(
            food.x+6,
            food.y+12,
            6,
            0,
            Math.PI*2
        );

        ctx.arc(
            food.x+15,
            food.y+12,
            6,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#00ff66";
        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(
            food.x+8,
            food.y+7
        );

        ctx.lineTo(
            food.x+11,
            food.y
        );

        ctx.lineTo(
            food.x+16,
            food.y+7
        );

        ctx.stroke();
    }

    else if(food.type==="orange"){

        ctx.fillStyle=f.color;

        ctx.beginPath();

        ctx.arc(
            food.x+10,
            food.y+10,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    else if(food.type==="watermelon"){

        ctx.fillStyle="#00cc55";

        ctx.beginPath();

        ctx.arc(
            food.x+10,
            food.y+10,
            9,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#ff3355";

        ctx.beginPath();

        ctx.arc(
            food.x+10,
            food.y+10,
            6,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle="#111";

        for(let i=0;i<3;i++){

            ctx.fillRect(
                food.x+6+i*4,
                food.y+7,
                2,
                2
            );
        }
    }

    else if(food.type==="grape"){

        ctx.fillStyle=f.color;

        [
            [5,5],[12,5],
            [2,11],[9,11],[16,11],
            [6,17],[13,17]
        ].forEach(p=>{

            ctx.beginPath();

            ctx.arc(
                food.x+p[0],
                food.y+p[1],
                4,
                0,
                Math.PI*2
            );

            ctx.fill();
        });
    }

    else if(food.type==="bomb"){

        ctx.fillStyle="#111";

        ctx.beginPath();

        ctx.arc(
            food.x+10,
            food.y+11,
            8,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.strokeStyle="#ff007f";
        ctx.lineWidth=2;

        ctx.stroke();

        ctx.fillStyle="#ff8c00";

        ctx.beginPath();

        ctx.arc(
            food.x+14,
            food.y+2,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =====================================================
   DRAW SNAKE
===================================================== */

function drawSnake(){

    snake.cells.forEach(
        (cell,index)=>{

        ctx.save();

        const color=
            index===0
            ?"#ffff00"
            :snakeColor;

        ctx.fillStyle=color;

        ctx.shadowBlur=15;
        ctx.shadowColor=color;

        ctx.fillRect(
            cell.x+2,
            cell.y+2,
            grid-4,
            grid-4
        );

        if(index===0){

            ctx.shadowBlur=0;

            ctx.fillStyle="#000";

            let eye1;
            let eye2;

            if(snake.dx>0){

                eye1={
                    x:cell.x+14,
                    y:cell.y+5
                };

                eye2={
                    x:cell.x+14,
                    y:cell.y+13
                };

            }else if(snake.dx<0){

                eye1={
                    x:cell.x+6,
                    y:cell.y+5
                };

                eye2={
                    x:cell.x+6,
                    y:cell.y+13
                };

            }else if(snake.dy<0){

                eye1={
                    x:cell.x+5,
                    y:cell.y+6
                };

                eye2={
                    x:cell.x+13,
                    y:cell.y+6
                };

            }else{

                eye1={
                    x:cell.x+5,
                    y:cell.y+14
                };

                eye2={
                    x:cell.x+13,
                    y:cell.y+14
                };
            }

            ctx.beginPath();

            ctx.arc(
                eye1.x,
                eye1.y,
                2,
                0,
                Math.PI*2
            );

            ctx.arc(
                eye2.x,
                eye2.y,
                2,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        ctx.restore();

    });
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.fillStyle=
        backgroundColors[bgIndex];

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.strokeStyle=
        "rgba(0,242,254,.07)";

    for(
        let x=0;
        x<canvas.width;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,canvas.height);

        ctx.stroke();
    }

    for(
        let y=0;
        y<canvas.height;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(canvas.width,y);

        ctx.stroke();
    }

    foods.forEach(drawFood);

    drawSnake();
}


/* =====================================================
   SCORE
===================================================== */

function addScore(points){

    score+=points;

    if(score<0)
        score=0;

    scoreEl.textContent=score;

    if(score>best){

        best=score;

        bestEl.textContent=best;

        localStorage.setItem(
            "snake_best",
            String(best)
        );
    }
}


/* =====================================================
   SAVE SCORE TO SUPABASE
===================================================== */

async function saveScoreToSupabase(){

    if(!currentUser)
        return;

    try{

        const {error}=await supabaseClient
            .from("scores")
            .insert({

                user_id:currentUser.id,

                name:playerName,

                score:score,

                level:level

            });

        if(error){

            console.error(
                "Supabase score error:",
                error
            );
        }

    }catch(error){

        console.error(error);
    }
}


/* =====================================================
   LEVEL
===================================================== */

function updateLevel(){

    const newLevel=
        Math.floor(score/100)+1;

    if(newLevel!==level){

        level=newLevel;

        bgIndex=
            (level-1)%
            backgroundColors.length;

        const colors=[
            "#00f2fe",
            "#00ff99",
            "#ff66ff",
            "#00aaff",
            "#ff9900",
            "#ff00aa",
            "#66ff00",
            "#00ffff"
        ];

        snakeColor=
            colors[
                (level-1)%
                colors.length
            ];

        showMessage(
            "LEVEL "+level
        );
    }

    levelEl.textContent=level;
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

    message.textContent=text;

    message.classList.remove(
        "messageShow"
    );

    void message.offsetWidth;

    message.classList.add(
        "messageShow"
    );
}


/* =====================================================
   TOP PLAYERS
===================================================== */

async function showPlayers(){

    playersList.innerHTML="<p>Φόρτωση...</p>";

    playersOverlay.classList.remove("hidden");

    try{

        const {data,error}=await supabaseClient
            .from("scores")
            .select("*")
            .order("score",{ascending:false})
            .limit(20);

        if(error){

            console.error("SCORES ERROR:",error);

            playersList.innerHTML=
                "<p style='color:red'>"+
                "ERROR: "+
                escapeHtml(error.message)+
                "</p>";

            return;
        }

        if(!data || data.length===0){

            playersList.innerHTML=
                "<p>Δεν υπάρχουν ακόμα scores.</p>";

            return;
        }

        let html=`
        <div class="playerHeader">
            <div>#</div>
            <div>NAME</div>
            <div>SCORE</div>
            <div>LEVEL</div>
        </div>`;

        data.forEach((p,i)=>{

            html+=`
            <div class="playerRow">
                <div>${i+1}</div>
                <div>
                    <strong>${escapeHtml(p.name || "PLAYER")}</strong>
                </div>
                <div>${p.score ?? 0}</div>
                <div>${p.level ?? 1}</div>
            </div>`;
        });

        playersList.innerHTML=html;

    }catch(error){

        console.error("SCORES EXCEPTION:",error);

        playersList.innerHTML=
            "<p style='color:red'>"+
            "ERROR: "+
            escapeHtml(error.message || String(error))+
            "</p>";

/* =====================================================
   GAME OVER
===================================================== */

function drawGameOver(){

    draw();

    ctx.save();

    ctx.fillStyle=
        "rgba(2,0,12,.90)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.textAlign="center";

    ctx.font=
        "900 46px Arial Black,Segoe UI,sans-serif";

    ctx.fillStyle="#fff";

    ctx.shadowColor="#ff007f";
    ctx.shadowBlur=15;

    ctx.fillText(
        "GAME OVER",
        canvas.width/2,
        canvas.height/2-55
    );

    ctx.strokeStyle="#ff007f";
    ctx.lineWidth=2;

    ctx.shadowBlur=30;

    ctx.strokeText(
        "GAME OVER",
        canvas.width/2,
        canvas.height/2-55
    );

    ctx.font="900 28px Segoe UI";

    ctx.fillStyle="#00f2fe";

    ctx.shadowColor="#00f2fe";
    ctx.shadowBlur=18;

    ctx.fillText(
        "SCORE: "+score,
        canvas.width/2,
        canvas.height/2+5
    );

    ctx.font="900 24px Segoe UI";

    ctx.fillStyle="#ffff00";

    ctx.shadowColor="#ffff00";
    ctx.shadowBlur=18;

    ctx.fillText(
        "LEVEL: "+level,
        canvas.width/2,
        canvas.height/2+42
    );

    ctx.font="900 20px Segoe UI";

    ctx.fillStyle="#ff66cc";

    ctx.shadowColor="#ff007f";

    ctx.fillText(
        playerName || "PLAYER",
        canvas.width/2,
        canvas.height/2+78
    );

    ctx.restore();
}


async function endGame(){

    if(gameOver)
        return;

    gameOver=true;
    gameStarted=false;
    paused=false;
    turboActive=false;

    gameOverSound();

    await saveScoreToSupabase();

    startBtn.textContent="RESTART";

    drawGameOver();
}


/* =====================================================
   GAME STEP
===================================================== */

function step(){

    if(
        !gameStarted||
        paused||
        gameOver
    )
        return;

    snake.x+=snake.dx;
    snake.y+=snake.dy;

    if(snake.x<0)
        snake.x=canvas.width-grid;

    else if(snake.x>=canvas.width)
        snake.x=0;

    if(snake.y<0)
        snake.y=canvas.height-grid;

    else if(snake.y>=canvas.height)
        snake.y=0;

    snake.cells.unshift({
        x:snake.x,
        y:snake.y
    });

    if(
        snake.cells.length>
        snake.maxCells
    )
        snake.cells.pop();


    for(
        let i=1;
        i<snake.cells.length;
        i++
    ){

        if(
            snake.x===
            snake.cells[i].x &&
            snake.y===
            snake.cells[i].y
        ){

            endGame();

            return;
        }
    }


    for(
        let i=foods.length-1;
        i>=0;
        i--
    ){

        const food=foods[i];

        if(
            snake.x===food.x &&
            snake.y===food.y
        ){

            foods.splice(i,1);


            if(food.type==="bomb"){

                bombSound();

                score=Math.max(
                    0,
                    score-30
                );

                scoreEl.textContent=score;

                snake.maxCells=
                    Math.max(
                        4,
                        snake.maxCells-3
                    );

                while(
                    snake.cells.length>
                    snake.maxCells
                ){

                    snake.cells.pop();
                }

                document.body
                    .classList
                    .remove("shake");

                void document.body.offsetWidth;

                document.body
                    .classList
                    .add("shake");

                showMessage(
                    "💣 BOOM! -30"
                );

            }else{

                const points=
                    foodTypes[
                        food.type
                    ].points;

                addScore(points);

                snake.maxCells++;

                if(food.type==="apple"){

                    applesEaten++;

                    eatSound();

                    showMessage(
                        "🍎 +"+points
                    );

                }else{

                    bonusSound();

                    let text=
                        food.type
                        .toUpperCase();

                    if(
                        food.type==="grape"
                    ){

                        text=
                            "🍇 ΜΕΓΑΛΩΣΕ! +"+
                            points;
                    }

                    showMessage(text);
                }

                updateLevel();


                if(
                    applesEaten>0 &&
                    applesEaten%20===0
                ){

                    normalInterval=
                        Math.max(
                            35,
                            normalInterval*.99
                        );

                    turboInterval=
                        Math.max(
                            18,
                            turboInterval*.99
                        );
                }


                if(
                    food.type==="apple" &&
                    applesEaten%5===0
                ){

                    specialFood();
                }


                if(
                    !foods.some(
                        f=>f.type==="apple"
                    )
                ){

                    createFood("apple");
                }
            }

            break;
        }
    }
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

    requestAnimationFrame(gameLoop);

    if(
        !gameStarted||
        paused
    ){

        if(!gameOver)
            draw();

        return;
    }

    const interval=
        turboEnabled&&turboActive
        ?turboInterval
        :normalInterval;

    if(
        time-lastTime>=interval
    ){

        lastTime=time;

        step();

        if(!gameOver)
            draw();
    }
}

/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    e=>{

        const key=e.key;

        const keys=[
            "ArrowLeft",
            "ArrowRight",
            "ArrowUp",
            "ArrowDown"
        ];

        if(keys.includes(key))
            e.preventDefault();

        if(
            turboEnabled &&
            keys.includes(key)
        ){

            turboActive=true;
        }

        if(
            !gameStarted||
            paused||
            gameOver
        )
            return;

        if(
            key==="ArrowLeft" &&
            snake.dx===0
        ){

            snake.dx=-grid;
            snake.dy=0;

        }else if(
            key==="ArrowRight" &&
            snake.dx===0
        ){

            snake.dx=grid;
            snake.dy=0;

        }else if(
            key==="ArrowUp" &&
            snake.dy===0
        ){

            snake.dy=-grid;
            snake.dx=0;

        }else if(
            key==="ArrowDown" &&
            snake.dy===0
        ){

            snake.dy=grid;
            snake.dx=0;
        }
    }
);


window.addEventListener(
    "keyup",
    e=>{

        const keys=[
            "ArrowLeft",
            "ArrowRight",
            "ArrowUp",
            "ArrowDown"
        ];

        if(keys.includes(e.key))
            turboActive=false;
    }
);


/* =====================================================
   TOUCH CONTROLS
===================================================== */

function setDirection(direction){

    initAudio();

    if(
        !gameStarted||
        paused||
        gameOver
    )
        return;

    if(
        direction==="left" &&
        snake.dx===0
    ){

        snake.dx=-grid;
        snake.dy=0;

    }else if(
        direction==="right" &&
        snake.dx===0
    ){

        snake.dx=grid;
        snake.dy=0;

    }else if(
        direction==="up" &&
        snake.dy===0
    ){

        snake.dy=-grid;
        snake.dx=0;

    }else if(
        direction==="down" &&
        snake.dy===0
    ){

        snake.dy=grid;
        snake.dx=0;
    }
}


function setupDirectionButton(
    id,
    direction
){

    const button=
        document.getElementById(id);

    let timer=null;

    function press(){

        setDirection(direction);

        if(turboEnabled){

            turboActive=true;

            timer=setInterval(
                ()=>{

                    if(turboEnabled)
                        turboActive=true;

                },
                50
            );
        }
    }

    function release(){

        if(timer){

            clearInterval(timer);
            timer=null;
        }

        turboActive=false;
    }

    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            press();
        }
    );

    button.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            release();
        }
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );
}


setupDirectionButton(

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}
